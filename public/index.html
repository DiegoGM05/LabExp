<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LABEXP" />
  <link rel="manifest" href="/manifest.json" />
  <title>LABEXP | Plataforma de Empleo y Desarrollo Profesional</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- LABEXP Design System Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <!-- Root SPA Mount Point -->
  <div id="app"></div>

  <!-- Global Modal Dialog Overlay -->
  <div class="modal-overlay" id="global-modal-overlay">
    <div class="modal-dialog" id="global-modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="global-modal-title">Título Modal</h3>
        <button class="modal-close-btn" onclick="LABEXP_COMPONENTS.closeModal()" title="Cerrar ventana">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="global-modal-body"></div>
      <div class="modal-footer" id="global-modal-footer"></div>
    </div>
  </div>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container"></div>

  <!-- Application Architecture Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>

  <!-- Application View Controllers -->
  <script src="/js/views/landing.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/views/jobs.js"></script>
  <script src="/js/views/cvBuilder.js"></script>
  <script src="/js/views/careerCoach.js"></script>
  <script src="/js/views/interviewSimulator.js"></script>
  <script src="/js/views/courses.js"></script>
  <script src="/js/views/compatibility.js"></script>
  <script src="/js/views/applications.js"></script>
  <script src="/js/views/companyPortal.js"></script>
  <script src="/js/views/adminPortal.js"></script>
  <script src="/js/views/notifications.js"></script>
  <script src="/js/views/settings.js"></script>

  <!-- Main Controller / Router -->
  <script src="/js/main.js"></script>
</body>
</html>
